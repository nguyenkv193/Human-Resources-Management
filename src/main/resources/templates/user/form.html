<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title th:text="${isEdit ? 'Chỉnh sửa User' : 'Tạo User'}">User</title></head>
<body>
<section layout:fragment="content" class="page-section">
    <div class="page-header page-header--compact">
        <div>
            <div class="eyebrow">Người dùng</div>
            <h1 class="page-title" th:text="${isEdit ? 'Chỉnh sửa User' : 'Tạo User'}">Tạo User</h1>
            <p class="page-lead">Nhập thông tin tài khoản và phân quyền.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/users}">Quay lại</a>
    </div>

    <div class="surface-card form-card">
        <div class="form-card-intro">
            <span class="form-card-number">01</span>
            <div>
                <h2>Thông tin tài khoản</h2>
                <p>Thiết lập danh tính đăng nhập và quyền truy cập.</p>
            </div>
        </div>
        <div class="form-card-body">
            <form th:object="${userForm}" th:action="${isEdit ? '/users/' + userId : '/users'}" method="post" novalidate>
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger mb-4">
                    <div th:each="error : ${#fields.globalErrors()}" th:text="${error.defaultMessage}"></div>
                </div>

                <div class="form-grid">
                    <div>
                        <label for="username" class="form-label">Username</label>
                        <input id="username" type="text" class="form-control" th:field="*{username}"
                               th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" autocomplete="username">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    </div>
                    <div th:if="${!isEdit}">
                        <label for="password" class="form-label">Mật khẩu</label>
                        <input id="password" type="password" class="form-control" th:field="*{password}"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" autocomplete="new-password">
                        <div class="form-text">Tối thiểu 6 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt.</div>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    <div>
                        <label for="employeeId" class="form-label">Employee ID <span class="text-secondary">(tùy chọn)</span></label>
                        <input id="employeeId" type="number" min="1" class="form-control" th:field="*{employeeId}">
                    </div>
                    <div class="d-flex align-items-end" th:if="${isEdit}">
                        <div class="form-check form-switch mb-2">
                            <input id="enabled" type="checkbox" class="form-check-input" th:field="*{enabled}">
                            <label for="enabled" class="form-check-label">Tài khoản đang hoạt động</label>
                        </div>
                    </div>
                    <div class="form-field--full">
                        <label class="form-label">Roles</label>
                        <div class="role-picker">
                            <div th:if="${#lists.isEmpty(roles)}" class="text-secondary">Chưa có role trong hệ thống.</div>
                            <label class="role-choice" th:each="role : ${roles}" th:for="|role-${role.id}|">
                                <input class="form-check-input mt-0" type="checkbox" name="roleIds"
                                       th:id="|role-${role.id}|" th:value="${role.id}"
                                       th:checked="${userForm.roleIds != null and userForm.roleIds.contains(role.id)}">
                                <span th:text="${role.name}">ADMIN</span>
                            </label>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('roleIds')}" th:errors="*{roleIds}"></div>
                    </div>
                </div>

                <div class="form-actions">
                    <a class="btn btn-outline-secondary" th:href="@{/users}">Hủy</a>
                    <button class="btn btn-primary" type="submit" th:text="${isEdit ? 'Lưu thay đổi' : 'Tạo User'}">Lưu</button>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
