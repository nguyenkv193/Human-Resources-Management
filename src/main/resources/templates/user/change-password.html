<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Đổi mật khẩu</title>
</head>
<body>
<section layout:fragment="content" class="page-section">
    <div class="page-header page-header--compact">
        <div>
            <div class="eyebrow"><span class="eyebrow-mark" aria-hidden="true"></span> Directory / 03</div>
            <h1 class="page-title">Đổi mật khẩu</h1>
            <p class="page-lead">Cập nhật thông tin bảo mật cho User: <strong th:text="${user.username}">admin</strong></p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/users}">Quay lại</a>
    </div>

    <div class="surface-card form-card" style="max-width: 700px;">
        <div class="form-card-intro">
            <span class="form-card-number">02</span>
            <div>
                <h2>Thông tin bảo mật</h2>
                <p>Mật khẩu mới nên khó đoán và chỉ được chia sẻ với người dùng.</p>
            </div>
        </div>
        <div class="form-card-body">
            <form th:object="${passwordForm}"
                  th:action="@{/users/{id}/password(id=${user.id})}"
                  method="post" novalidate>
                <input type="hidden" th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger mb-4">
                    <div th:each="error : ${#fields.globalErrors()}" th:text="${error.defaultMessage}"></div>
                </div>

                <div class="form-grid">
                    <div class="form-field--full">
                        <label for="currentPassword" class="form-label">Mật khẩu hiện tại</label>
                        <input id="currentPassword" type="password" class="form-control"
                               th:field="*{currentPassword}"
                               th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"
                               autocomplete="current-password">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                    </div>
                    <div>
                        <label for="newPassword" class="form-label">Mật khẩu mới</label>
                        <input id="newPassword" type="password" class="form-control"
                               th:field="*{newPassword}"
                               th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                               autocomplete="new-password">
                        <div class="form-text">Tối thiểu 6 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt.</div>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                    </div>
                    <div>
                        <label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới</label>
                        <input id="confirmPassword" type="password" class="form-control"
                               th:field="*{confirmPassword}"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                               autocomplete="new-password">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('passwordMatched')}" th:errors="*{passwordMatched}"></div>
                    </div>
                </div>

                <div class="form-actions">
                    <a class="btn btn-outline-secondary" th:href="@{/users}">Hủy</a>
                    <button class="btn btn-primary" type="submit">Đổi mật khẩu</button>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
