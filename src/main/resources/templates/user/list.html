<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Quản lý User</title>
</head>
<body>
<section layout:fragment="content">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1">Quản lý User</h1>
            <p class="text-secondary mb-0">Quản lý tài khoản và quyền truy cập hệ thống.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/users/new}">
            <span aria-hidden="true">+</span> Tạo User
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <form class="row g-2 mb-4" method="get" th:action="@{/users}">
                <div class="col-md-6 col-lg-5">
                    <label class="visually-hidden" for="keyword">Tìm username</label>
                    <input id="keyword" name="keyword" class="form-control"
                           placeholder="Tìm theo username..." th:value="${keyword}">
                </div>
                <div class="col-auto">
                    <button class="btn btn-outline-primary" type="submit">Tìm kiếm</button>
                </div>
                <div class="col-auto" th:if="${keyword != null and !keyword.isBlank()}">
                    <a class="btn btn-outline-secondary" th:href="@{/users}">Xóa lọc</a>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Employee ID</th>
                        <th>Role</th>
                        <th>Trạng thái</th>
                        <th class="text-end">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="6" class="text-center text-secondary py-4">Chưa có user nào.</td>
                    </tr>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td class="fw-semibold" th:text="${user.username}">admin</td>
                        <td th:text="${user.employeeId != null ? user.employeeId : '-'}">-</td>
                        <td>
                            <span th:if="${user.roles == null or user.roles.isEmpty()}" class="text-secondary">-</span>
                            <span th:each="role : ${user.roles}" class="badge text-bg-light border me-1"
                                  th:text="${role.name}">ADMIN</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${user.enabled ? 'text-bg-success' : 'text-bg-secondary'}"
                                  th:text="${user.enabled ? 'Đang hoạt động' : 'Đã vô hiệu hóa'}">Đang hoạt động</span>
                        </td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/users/{id}/edit(id=${user.id})}">Sửa</a>
                            <a class="btn btn-sm btn-outline-warning"
                               th:href="@{/users/{id}/password(id=${user.id})}">Đổi mật khẩu</a>
                            <form class="d-inline" method="post"
                                  th:action="@{/users/{id}/toggle(id=${user.id})}">
                                <input type="hidden" th:if="${_csrf != null}"
                                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn-sm btn-outline-secondary" type="submit"
                                        th:text="${user.enabled ? 'Vô hiệu hóa' : 'Kích hoạt'}">Vô hiệu hóa</button>
                            </form>
                            <form class="d-inline" method="post"
                                  th:action="@{/users/{id}/delete(id=${user.id})}">
                                <input type="hidden" th:if="${_csrf != null}"
                                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn-sm btn-outline-danger" type="submit"
                                        onclick="return confirm('Bạn có chắc muốn xóa user này không?')">Xóa</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</body>
</html>
