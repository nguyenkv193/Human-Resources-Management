<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/css/base.css}">

    <title layout:title-pattern="$CONTENT_TITLE | Human Resources">
        Human Resources
    </title>
</head>
<body>
<div class="main-layout">
    <header class="app-header">
        <nav class="navbar bg-primary app-navbar" data-bs-theme="dark">
            <div class="container-fluid px-3 px-lg-4">
                <button class="btn btn-outline-light d-lg-none me-2"
                        type="button"
                        data-bs-toggle="offcanvas"
                        data-bs-target="#appSidebar"
                        aria-controls="appSidebar"
                        aria-label="Mở menu">
                    <span aria-hidden="true">☰</span>
                </button>

                <a class="navbar-brand fw-semibold" th:href="@{/}">
                    Human Resources
                </a>

                <div class="dropdown ms-auto">
                    <button class="btn btn-primary dropdown-toggle"
                            type="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false">
                        <span sec:authentication="name">Tài khoản</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/users}">Quản lý User</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <input type="hidden" th:if="${_csrf != null}"
                                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="dropdown-item" type="submit">Đăng xuất</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-2 p-0">
                <aside id="appSidebar"
                       class="app-sidebar offcanvas-lg offcanvas-start bg-white border-end"
                       tabindex="-1"
                       aria-labelledby="appSidebarLabel">
                    <div class="offcanvas-header border-bottom d-lg-none">
                        <h5 class="offcanvas-title" id="appSidebarLabel">Menu</h5>
                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="offcanvas"
                                aria-label="Đóng menu"></button>
                    </div>

                    <div class="offcanvas-body d-flex flex-column p-0">
                        <div class="px-3 pt-4 pb-2">
                            <small class="text-uppercase text-secondary fw-semibold">
                                Điều hướng
                            </small>
                        </div>

                        <nav class="nav nav-pills flex-column gap-1 px-3">
                            <a class="nav-link sidebar-link" th:href="@{/}">
                                Dashboard
                            </a>
                            <a class="nav-link sidebar-link" th:href="@{/users}" aria-current="page">
                                Người dùng
                            </a>
                            <a class="nav-link sidebar-link" href="#">
                                Nhân viên
                            </a>
                            <a class="nav-link sidebar-link" href="#">
                                Phòng ban
                            </a>
                            <a class="nav-link sidebar-link" href="#">
                                Chấm công
                            </a>
                            <a class="nav-link sidebar-link" href="#">
                                Nghỉ phép
                            </a>
                        </nav>

                        <div class="mt-auto border-top p-3 text-secondary small">
                            Human Resources System
                        </div>
                    </div>
                </aside>
            </div>

            <main class="main-content col-lg-10 p-3 p-lg-4" layout:fragment="content">
                Nội dung trang sẽ hiển thị ở đây.
            </main>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
