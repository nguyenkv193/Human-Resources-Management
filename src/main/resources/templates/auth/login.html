<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <title>Đăng nhập | Human Resources</title>
</head>
<body class="login-page">
<main class="login-shell">
    <section class="login-visual">
        <a class="login-brand" th:href="@{/login}">
            <img class="brand-mark" th:src="@{/img/hr-mark.svg}" alt="Human Resources logo">
            <span>
                <span class="login-brand-name">Human Resources</span>
                <span class="login-brand-subtitle">People operations</span>
            </span>
        </a>
    </section>

    <section class="login-form-panel">
        <div class="login-form-wrap">
            <div class="login-form-heading">
                <div class="login-kicker">Đăng nhập</div>
                <h1>Chào mừng trở lại</h1>
                <p>Truy cập vào không gian quản trị nhân sự của bạn.</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger mb-4" role="alert">Username hoặc mật khẩu không chính xác.</div>
            <div th:if="${param.logout}" class="alert alert-success mb-4" role="alert">Bạn đã đăng xuất.</div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="login-field">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" name="username" type="text" class="form-control"
                           required autofocus autocomplete="username" placeholder="Nhập username">
                </div>
                <div class="login-field">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input id="password" name="password" type="password" class="form-control"
                           required autocomplete="current-password" placeholder="Nhập mật khẩu">
                </div>
                <button class="btn btn-primary login-submit" type="submit">Đăng nhập</button>
            </form>

            <div class="login-secure-note">
                <span class="presence-dot" aria-hidden="true"></span>
                <span>Kết nối bảo mật · Human Resources</span>
            </div>
        </div>
    </section>
</main>
</body>
</html>
